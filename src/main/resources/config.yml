# Arena Auto Setup
# Vertical build limit for automatically generated arena boundaries.
# Allowed: 10-25 (defaults to 15 if invalid).
arena-auto-setup:
  build-limit: 15

# SlimeWorldManager integration. The loader must exist in SWM's config.
# Preferable: file
swm:
  loader: file
# This feature is experimental.
# When enabled, the plugin automatically creates temporary arenas on demand.
# If there are not enough free arenas, players won't have to wait for an arena to become available.
# Instead, new temporary arenas are generated instantly, making the server feel like it has unlimited arenas.
runtime-overflow:
  enabled: true

# Shared Arena
# Allows multiple kits listed below to use the same arena.
# When combined with Runtime Overflow, you only need a few arenas to support unlimited matches.
# Example: Set up just 4-5 arenas, enable both features, and every supported kit can run as many matches as needed.
# Pretty cool, right? :)
Shared-Arena:
  Enabled: true
  Modes:
    NODEBUFF: true
    BOXING: true
    BUILDUHC: true
    COMBO: true
    GAPPLE: true
    ARCHER: true
    CLASSIC: true
    IRON: true
    DIAMOND: true
    HCF: true
    FINALUHC: true
    DEBUFF: true
    SOUP: true
    AXE: true