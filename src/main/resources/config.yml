# when using any ai to modify kb etc., provide it with max in-game detailing as possible as it will provide
# you worst configs if not defined properly (based on personal experience ;-;)
# TNT & Fireball Settings.
special:
  tnt:
    enabled: true
    # How many ticks before the TNT blasts (20 ticks = 1 second).
    fuseTicks: 60
    # Blast radius in blocks.
    radius: 4.5
    # Base outward force applied to nearby players
    knockback: 2.8
    intensity: 1.0
    breakPlacedBlocks: true
    breakBreakableBlocks: true
    breakEndstone: true
    breakBeds: false
    damagePlayers: false

  fireball:
    enabled: true
    radius: 4.0
    knockback: 3.0
    speed: 2.8
    cooldownTicks: 8
    breakPlacedBlocks: true
    breakBreakableBlocks: false
    breakEndstone: false
    breakBeds: false
    damagePlayers: false

    bounce:
      enabled: true
      max-range: 4.0
      max-angle: 35.0
      speed-multiplier: 1.0


# bot settings, no need to change anything, cuz it will not work ;-;
